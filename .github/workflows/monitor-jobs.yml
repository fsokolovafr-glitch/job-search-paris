name: Monitor jobs
on:
  schedule:
    - cron: '0 10 */2 * *'
  push:
    branches: [main]
    paths: ['sources/artifact-*.json', 'scripts/**', '.github/workflows/monitor-jobs.yml']
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [monitor, sync]
        default: monitor
permissions:
  contents: write
concurrency:
  group: job-pipeline-main
  cancel-in-progress: false
jobs:
  monitor:
    # Enabled by default; explicit opt-out still supported.
    if: vars.MONITOR_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test before writing data
        run: python -m unittest discover -s tests -v
      - name: Import, monitor and generate
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          PIPELINE_ACTION: ${{ github.event_name == 'push' && 'sync' || inputs.action || 'monitor' }}
        run: python scripts/automation.py
      - name: Validate state and derived files
        run: python scripts/update-tracker.py
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ dashboard/ reports/
          if ! git diff --cached --quiet; then
            git commit -m 'Sync pipeline data, dashboard and monitoring reports'
            git push origin HEAD:main
          fi
      - name: Preserve results and recovery copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-pipeline-results
          path: |
            data/*.json
            data/job-search.db
            dashboard/
            reports/
