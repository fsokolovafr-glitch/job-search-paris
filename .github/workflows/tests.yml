name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install coverage==7.10.7
      - run: python -m coverage run --source=scripts -m unittest discover -s tests -v
      - run: python -m coverage report --include='*/history_store.py' --fail-under=90
      - run: python scripts/update-tracker.py
      - run: python scripts/check-jobs.py --mode mock --output work/ci-demo
      - run: python scripts/check-jobs.py --mode mock --output work/ci-demo
      - run: python scripts/update-tracker.py --root work/ci-demo
      - run: python scripts/job-analytics.py --db work/ci-demo/data/job-search.db --trend 30d
